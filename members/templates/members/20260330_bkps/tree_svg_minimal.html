<div style="width: 100%; overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc;">
    <svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" style="display: block; margin: 0 auto;">
        
        <style>
            .node-main { fill: #4f46e5; }
            .node-child { fill: #6366f1; }
            .node-text { fill: white; font-family: sans-serif; font-weight: bold; text-anchor: middle; }
            .line { stroke: #cbd5e1; stroke-width: 2; fill: none; }
        </style>

        <g transform="translate(500, 50)">
            <rect width="200" height="60" rx="10" class="node-main" />
            <text x="100" y="35" class="node-text">{{ member.first_name }}</text>
        </g>

        {% if hijos %}
            <line x1="600" y1="110" x2="600" y2="160" class="line" />
            
            {% with total=hijos.count %}
                {% if total > 1 %}
                    <line x1="200" y1="160" x2="1000" y2="160" class="line" />
                {% else %}
                    <line x1="600" y1="160" x2="600" y2="160" class="line" />
                {% endif %}

                {% for hijo in hijos %}
                    {% widthratio forloop.counter0 1 800 as temp_x %}
                    
                    {# CORRECCIÓN: Usamos un bloque with anidado en lugar de 'define' #}
                    {% if total > 1 %}
                        {% widthratio temp_x total|add:"-1" 1 as offset_x %}
                    {% else %}
                        {# Si es hijo único, forzamos el offset a 400 para que sumado a 200 dé 600 #}
                        {% with "400" as offset_x %}
                            {% with pos_x=offset_x|add:"200" %}
                                <g transform="translate({{ pos_x|add:"-100" }}, 240)">
                                    <line x1="100" y1="-80" x2="100" y2="0" class="line" />
                                    <rect width="200" height="70" rx="8" class="node-child" />
                                    <text x="100" y="30" class="node-text" style="font-size: 13px;">{{ hijo.first_name }}</text>
                                    <text x="100" y="52" class="node-text" style="font-size: 10px; font-weight: normal; opacity: 0.9;">{{ hijo.last_name_paterno }}</text>
                                </g>
                            {% endwith %}
                        {% endwith %}
                    {% endif %}

                    {% if total > 1 %}
                        {% with pos_x=offset_x|add:"200" %}
                        <g transform="translate({{ pos_x|add:"-100" }}, 240)">
                            <line x1="100" y1="-80" x2="100" y2="0" class="line" />
                            <rect width="200" height="70" rx="8" class="node-child" />
                            <text x="100" y="30" class="node-text" style="font-size: 13px;">{{ hijo.first_name }}</text>
                            <text x="100" y="52" class="node-text" style="font-size: 10px; font-weight: normal; opacity: 0.9;">{{ hijo.last_name_paterno }}</text>
                        </g>
                        {% endwith %}
                    {% endif %}
                {% endfor %}
            {% endwith %}
        {% endif %}
    </svg>
</div>
